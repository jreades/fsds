# jupyter: python3
freeze: auto
format:
  ipynb:
    number-sections: true
    shift-heading-level-by: 1
    #cache: true # Not compatible with inline expressions
  html:
    #embed-resources: true
    code-copy: true
    code-link: true
    toc: true
    toc-title: "On this page"
    toc-depth: 1
    toc_float: 
      collapsed: false
      smooth_scroll: true
# No pdf here, so the default (site) render skips LaTeX. PDF settings live in
# _quarto-pracs.yml; build answers with: quarto render --profile pracs --to ipynb,pdf
