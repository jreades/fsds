# quarto render --profile content --no-clean
# Week pages, decks and assessments only (skips the slow practicals).
# --no-clean matters: without it Quarto empties _site first, losing the
# practicals and root pages from the last full render.
project:
  render:
    - "sessions/*.qmd"
    - "lectures/*.qmd"
    - "assessments/*.qmd"
