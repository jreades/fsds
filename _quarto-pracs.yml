# quarto render --profile pracs --to ipynb,pdf
# --to is required: practicals/_metadata.yml lists only ipynb + html (so the
# site render skips LaTeX), and a profile can't add formats to that list.
# https://quarto.org/docs/books/book-output.html
# https://quarto.org/docs/projects/profiles.html
project:
  pre-render:
    - scripts/pracs-pre.py
  post-render:
    - scripts/pracs-post.py
  output-dir: _answers 
  render:
    - "practicals/*.qmd"
  resources:
    - "img/"
    - "practicals/img/"
    - "!assessments"
    - "!data/"
    - "!lectures/"
    - "!sessions/"
    - "!setup/"
    - "!ref/"
qna:
  ipynb: answer
  pdf: answer
filters:
  - callouts-ipynb
format:
  typst:
    mainfontfallback: ["Arial"]
  pdf: # https://quarto.org/docs/reference/formats/pdf.html
    # Only built here (answers, via --to), not in the default site render.
    # latex-auto-mk: false # Should prevent auto-updates but doesn't seem to work
    papersize: a4
    geometry:
      - top=25mm
      - left=40mm
      - right=25mm
      - bottom=25mm
      - heightrounded
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 1
    colorlinks: true
    cap-location: top
    highlight-style: github
    mainfont: "Liberation Serif"
    sansfont: "Cousine"
    monofont: "Source Code Pro"
    monofontoptions:
      - Scale=0.85
    code-line-numbers: false
    code-block-border-left: "#b98bd6"
    code-block-bg: "#f5edfa"
    include-in-header:
      text: |
        \addtokomafont{disposition}{\rmfamily}
        \usepackage[hyphens]{url}
