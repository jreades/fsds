# https://quarto.org/docs/books/book-output.html
project:
  pre-render:
    - scripts/pre.py
  post-render:
    - scripts/post.py
  type: website
  output-dir: _site
  preview:
    port: 4200
    browser: false
  render:
    - "*.qmd"
  resources:
    - "bib/"
    - "img/"
    - "!data/"
execute:
  freeze: auto

metadata-files:
  - _website.yml

qna:
  ipynb: question
  html: question
  pdf: question

#latex-auto-mk: false

format:
  html:
    axe:
      output: console
    theme:
      - minty
      - brand
      - css/casa-report.scss
      - css/casa-web.scss
    mainfont: "Aptos, Arial, sans-serif"
    code-copy: true
    code-link: true
    code-overflow: wrap
    #cover-image: cover.png
    toc: true
    toc-depth: 3
    toc-expand: 2
    toc-title: "On this page"
  revealjs:
    # Quarto <1.9 bug: this crashed theme compilation (fixed variable
    # dependency hardcoded to "bootstrap", which doesn't exist for
    # revealjs). Fixed upstream by 1.10.18 — the axe report now depends on
    # "reveal-theme" for revealjs and uses CSS custom properties instead of
    # SCSS variables. See quality_reports/session_logs/2026-09-15_axe-accessibility-navbar.md.
    axe:
      output: document
    # multiplex: true
    # embed-resources: true
    logo: "/img/logo/full.svg"
    template-partials:
      - /inc/title-slide.html
    fontfamily: "Aptos, Arial, sans-serif"
    transition: none
    slide-number: false
    slide-level: 2
    preview-links: auto
    theme:
      - css/casa-slides.scss # Must be valid *relative* path
    footer: "[CC BY-NC-SA 4.0 2022-2026 | Jon Reades](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
    title-slide-attributes:
      data-background-image: "/img/web/title-slide.png"
      data-background-size: stretch
      data-background-opacity: "0.08"
      data-background-color: "#4e3c56"
highlight-style: pygments
code-copy: true
code-line-numbers: true
history: false
from: markdown+emoji
filters:
  - code-visibility
lightbox: auto

bibliography: ref/Readings.bib
csl: ref/chicago-author-date.csl
